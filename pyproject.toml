# Root configuration for development tooling only.
# Recipes are standalone and pin their own runtime dependencies in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["recipes"]
python_files = ["test_*.py"]
markers = [
    "reference: compares against a non-MLX reference implementation; requires dev extras",
    "slow: takes more than a few seconds",
]
